name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python scripts/check-doc-links.py

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Compile check only; real builds go through `stellar contract build`,
      # which also sets this flag after shaking the contract spec.
      - run: cargo build --target wasm32v1-none --release
        env:
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: "1"

  # Off-chain tools: scanner checks run against fixtures (no network needed).
  tools:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm test

  # cargo scout-audit (CoinFabrik). The official action cannot build
  # soroban-sdk 28, so scout runs through scripts/scout.sh (see its header).
  # No rust-cache here: a restored cache leaves scout's detector build out of
  # sync with the nightly toolchain it installs, and the detectors fail to build.
  scout-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Pinned: 0.3.17 (25/09/2026) looks for a detectors branch that does not exist upstream.
      - run: cargo install --locked cargo-dylint dylint-link cargo-scout-audit@0.3.16
      # Drop the committed report so a failed run can never publish a stale one.
      - run: rm -f docs/scout-report.md && bash scripts/scout.sh
      - name: gate on critical findings
        run: |
          row=$(grep -E '^\| policy_vault ' docs/scout-report.md)
          echo "$row"
          echo "$row" | awk -F'|' '{ gsub(/ /, "", $3); gsub(/ /, "", $4); if ($3 != "Analyzed" || $4 + 0 > 0) exit 1 }'
      - name: report
        if: always()
        run: cat docs/scout-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scout-report
          path: docs/scout-report.md
          if-no-files-found: ignore
